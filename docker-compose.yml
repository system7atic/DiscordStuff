services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: discordstuff
      POSTGRES_PASSWORD: discordstuff
      POSTGRES_DB: discordstuff
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discordstuff"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
